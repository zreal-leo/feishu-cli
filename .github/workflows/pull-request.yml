name: Pull Request Checks

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    format:
        name: Format
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.5.0
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Check formatting
              run: pnpm dlx oxfmt@0.55.0 --check .

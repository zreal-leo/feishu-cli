name: Rewrite PR Commit Author

on:
    issue_comment:
        types:
            - created

permissions:
    contents: write
    issues: write
    pull-requests: read

concurrency:
    group: rewrite-pr-author-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    rewrite:
        name: Rewrite author from PR comment
        if: >-
            github.event.issue.pull_request != null &&
            github.event.comment.body == '@cursoragent 将 PR 下所有 commit author 改成我，Co-authored-by 不变'
        runs-on: ubuntu-latest
        steps:
            - name: Check trigger permission
              id: permission
              env:
                  AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.issue.number }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  if [ "$AUTHOR_ASSOCIATION" != "OWNER" ]; then
                      gh issue comment "$PR_NUMBER" \
                          --repo "$REPO" \
                          --body "已拒绝：只有仓库 OWNER 可以触发改写 PR commit author 的 workflow。"
                      echo "authorized=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  echo "authorized=true" >> "$GITHUB_OUTPUT"

            - name: Load pull request
              id: pr
              if: steps.permission.outputs.authorized == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.issue.number }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  gh api "repos/${REPO}/pulls/${PR_NUMBER}" > pr.json

                  head_repo=$(jq -r '.head.repo.full_name' pr.json)
                  base_repo=$(jq -r '.base.repo.full_name' pr.json)
                  head_ref=$(jq -r '.head.ref' pr.json)
                  base_ref=$(jq -r '.base.ref' pr.json)
                  head_sha=$(jq -r '.head.sha' pr.json)

                  if [ "$head_repo" != "$base_repo" ]; then
                      gh issue comment "$PR_NUMBER" \
                          --repo "$REPO" \
                          --body "已跳过：该 PR 来自 fork，workflow 不会自动强推改写外部仓库分支。"
                      echo "same_repo=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  {
                      echo "same_repo=true"
                      echo "head_ref=$head_ref"
                      echo "base_ref=$base_ref"
                      echo "head_sha=$head_sha"
                  } >> "$GITHUB_OUTPUT"

            - name: Report pull request load failure
              if: >-
                  always() &&
                  steps.permission.outputs.authorized == 'true' &&
                  steps.pr.outcome == 'failure'
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.issue.number }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  gh issue comment "$PR_NUMBER" \
                      --repo "$REPO" \
                      --body "未完成：读取 PR 元数据失败，请查看本次 Actions 日志。"

            - name: Checkout PR branch
              if: >-
                  steps.permission.outputs.authorized == 'true' &&
                  steps.pr.outputs.same_repo == 'true'
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ steps.pr.outputs.head_ref }}
                  token: ${{ github.token }}

            - name: Rewrite commit authors
              id: rewrite
              if: >-
                  steps.permission.outputs.authorized == 'true' &&
                  steps.pr.outputs.same_repo == 'true'
              env:
                  BASE_REF: ${{ steps.pr.outputs.base_ref }}
                  HEAD_REF: ${{ steps.pr.outputs.head_ref }}
                  TARGET_AUTHOR_EMAIL: ${{ github.event.comment.user.id }}+${{ github.event.comment.user.login }}@users.noreply.github.com
                  TARGET_AUTHOR_NAME: ${{ github.event.comment.user.login }}
              run: |
                  set -euo pipefail

                  git fetch origin \
                      "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
                      "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
                  git checkout -B "$HEAD_REF" "refs/remotes/origin/${HEAD_REF}"

                  base_commit=$(git merge-base "refs/remotes/origin/${BASE_REF}" HEAD)
                  commit_count=$(git rev-list --count "${base_commit}..HEAD")

                  if [ "$commit_count" -eq 0 ]; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      echo "reason=no_commits" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  before_sha=$(git rev-parse HEAD)
                  export TARGET_AUTHOR_EMAIL TARGET_AUTHOR_NAME

                  FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter '
                  GIT_AUTHOR_NAME="$TARGET_AUTHOR_NAME"
                  GIT_AUTHOR_EMAIL="$TARGET_AUTHOR_EMAIL"
                  export GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL
                  ' "${base_commit}..HEAD"

                  after_sha=$(git rev-parse HEAD)

                  if [ "$before_sha" = "$after_sha" ]; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      echo "reason=already_matched" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"
                  echo "after_sha=$after_sha" >> "$GITHUB_OUTPUT"

            - name: Push rewritten branch
              id: push
              if: steps.rewrite.outputs.changed == 'true'
              env:
                  EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
                  HEAD_REF: ${{ steps.pr.outputs.head_ref }}
              run: |
                  set -euo pipefail

                  git push \
                      --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD_SHA}" \
                      origin \
                      "HEAD:refs/heads/${HEAD_REF}"

            - name: Report result
              if: >-
                  steps.permission.outputs.authorized == 'true' &&
                  steps.pr.outputs.same_repo == 'true' &&
                  always()
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.issue.number }}
                  REPO: ${{ github.repository }}
                  PUSH_OUTCOME: ${{ steps.push.outcome }}
                  REWRITE_CHANGED: ${{ steps.rewrite.outputs.changed }}
                  REWRITE_REASON: ${{ steps.rewrite.outputs.reason }}
              run: |
                  set -euo pipefail

                  if [ "$REWRITE_CHANGED" = "true" ] && [ "$PUSH_OUTCOME" = "success" ]; then
                      body="已完成：PR 分支上的 commit author 已改为 @${{ github.event.comment.user.login }}，commit message 中的 Co-authored-by 保持不变。"
                  elif [ "$REWRITE_CHANGED" = "true" ]; then
                      body="未完成：commit author 已在 workflow 中改写，但推送 PR 分支失败，请查看本次 Actions 日志。"
                  elif [ "$REWRITE_REASON" = "no_commits" ]; then
                      body="已跳过：该 PR 相对 base 分支没有可改写的 commit。"
                  elif [ "$REWRITE_REASON" = "already_matched" ]; then
                      body="无需修改：该 PR 分支 commit author 已经是 @${{ github.event.comment.user.login }}。"
                  else
                      body="未完成：改写 PR commit author 的 workflow 没有产生结果，请查看本次 Actions 日志。"
                  fi

                  gh issue comment "$PR_NUMBER" --repo "$REPO" --body "$body"
